<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirada de 4 Cartas</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Descubre tu mensaje</h1>
        
        <button id="tirarBtn">Obtener 4 cartas</button>
        <br>
        <p>Carta 1 superior: consejo</p>
        <p>Carta 2 izquierda: bloqueo</p>
        <p>Carta 3 derecha: posibilidad</p>
        <p>Carta 4 superior: aspecto inconsciente</p>

        <section id="cruz">
            <div id="arriba" class="carta"></div>
            <div id="izquierda" class="carta"></div>
            <div id="derecha" class="carta"></div>
            <div id="abajo" class="carta"></div>
        </section>

        <button id="reiniciarBtn" class="oculto">
            Comenzar de nuevo
        </button>

    </main>

    <script src="script.js"></script>   

</body>
</html>
