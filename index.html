<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tirada de 4 Cartas</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Piensa en esa situación que quieres resolver</h1>
        <p>Carta 1: bloqueo.</p>
        <p>Carta 2: aspecto inconsciente.</p>
        <p>Carta 3: consejo.</p>
        <p>Carta 4: posibilidad.</p>
        <br>
        <button id="tirarBtn">Recibe 4 runas draconianas con mensajes</button>

        <section id="cruz">
            <div id="arriba" class="carta"></div>
            <div id="izquierda" class="carta"></div>
            <div id="derecha" class="carta"></div>
            <div id="abajo" class="carta"></div>
        </section>

        <button id="reiniciarBtn" class="oculto">Comenzar de nuevo</button>

    </main>

    <script src="script.js"></script>   

</body>
</html>
